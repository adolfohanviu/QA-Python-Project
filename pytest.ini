[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --alluredir=allure-results
    --strict-markers
    --tb=short
    -p no:warnings

markers =
    smoke: Smoke tests
    regression: Regression tests
    contract: Contract tests (API/schema behavior)
    api: API tests
    ui: UI tests
    slow: Slow tests
    bdd: BDD scenarios (Gherkin + pytest-bdd)
    unit: Unit tests (no browser, no network)

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
