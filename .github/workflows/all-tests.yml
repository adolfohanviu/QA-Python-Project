name: All Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install -r requirements-lock.txt
    
    - name: Install Playwright browsers
      run: playwright install
    
    - name: Run all tests
      run: pytest -v --junitxml=test-results.xml
      env:
        BASE_URL: https://www.saucedemo.com
        API_BASE_URL: https://jsonplaceholder.typicode.com
        HEADLESS: true

    - name: AI failure triage
      if: failure()
      continue-on-error: true
      run: python scripts/ai_failure_triage.py
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Generate Allure Report
      if: always()
      continue-on-error: true
      run: |
        if [ -d allure-results ]; then
          echo "Allure results directory exists"
          ls -la allure-results
        else
          echo "No allure results found"
        fi
    
    - name: Upload Allure Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results
        retention-days: 30

    - name: Upload AI triage report
      if: failure()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ai-triage-report
        path: triage-report.md
        retention-days: 30
