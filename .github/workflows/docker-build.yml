name: Docker Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        load: true
        tags: qa-python-tests:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Run tests in Docker
      continue-on-error: true
      run: |
        mkdir -p allure-results
        docker run --rm \
          -e HEADLESS=true \
          -e BASE_URL=https://www.saucedemo.com \
          -e API_BASE_URL=https://jsonplaceholder.typicode.com \
          -v ${{ github.workspace }}/allure-results:/app/allure-results \
          qa-python-tests:${{ github.sha }} \
          bash -c "pytest tests -v --alluredir=allure-results || true"
        
        echo "Docker test execution completed"
        if [ -d allure-results ] && [ -n "$(ls -A allure-results)" ]; then
          echo "✓ Allure results found"
          ls -la allure-results
        else
          echo "⚠ No allure results generated - tests may have failed"
        fi
    
    - name: Generate Allure Report
      if: always()
      continue-on-error: true
      run: |
        if [ -d allure-results ]; then
          echo "Allure results directory exists"
          ls -la allure-results
        else
          echo "No allure results found"
        fi
    
    - name: Upload Allure Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-docker
        path: allure-results
        retention-days: 30

  # Optional: Push to Docker registry
  docker-push:
    needs: docker-build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build and push (optional)
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false  # Change to true if using Docker Hub
        tags: qa-python-tests:latest,qa-python-tests:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
