name: Performance Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'  # Weekly on Monday at 05:00 UTC

jobs:
  jmeter-performance:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install Apache JMeter
      run: |
        curl -sL https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz -o jmeter.tgz
        tar -xzf jmeter.tgz
        echo "${GITHUB_WORKSPACE}/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

    - name: Run performance test plan
      run: |
        mkdir -p performance/results
        jmeter -n \
          -t performance/jmeter/user_api_load_test.jmx \
          -l performance/results/results.jtl \
          -e -o performance/results/html-report

    - name: Upload performance artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jmeter-performance-results
        path: |
          performance/results/results.jtl
          performance/results/html-report
        retention-days: 30
