name: Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: flake8 quality gate
      run: flake8 tests scripts

    - name: pylint quality gate
      run: pylint tests/api tests/utils tests/steps scripts --disable=R,C --fail-under=8.5

    - name: API regression gate
      run: pytest -m "api" -v
      env:
        API_BASE_URL: https://jsonplaceholder.typicode.com
        HEADLESS: true

    - name: AI failure triage unit tests
      run: pytest -m "unit" -v

    - name: Start WireMock mock
      run: docker compose --profile mock up -d wiremock

    - name: Wait for WireMock
      run: timeout 30 bash -c 'until curl -sf http://localhost:8081/__admin/mappings; do sleep 1; done'

    - name: Resilience gate (fault-injected retry/timeout)
      run: pytest -m "resilience" -v
      env:
        WIREMOCK_BASE_URL: http://localhost:8081

    - name: Stop WireMock mock
      if: always()
      run: docker compose --profile mock down
