# This directory is a plain manifest set (no Chart.yaml/templates), so this
# Job is meant to be launched with `kubectl create -f k8s/job.yaml` for each
# run - generateName lets the API server assign a unique name per creation.
# `kubectl apply` doesn't fit a generateName resource (there's no fixed name
# to diff against); use apply for the other manifests in this directory.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: qa-test-runner-
  namespace: qa-automation
  labels:
    app: qa-test-runner
    version: v1
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  ttlSecondsAfterFinished: 3600
  
  template:
    metadata:
      labels:
        app: qa-test-runner
    spec:
      serviceAccountName: qa-tests
      restartPolicy: Never
      
      containers:
      - name: test-runner
        image: qa-python-tests:latest
        imagePullPolicy: Always
        
        env:
        - name: HEADLESS
          valueFrom:
            configMapKeyRef:
              name: qa-test-config
              key: HEADLESS
        - name: BASE_URL
          valueFrom:
            configMapKeyRef:
              name: qa-test-config
              key: BASE_URL
        - name: API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: qa-test-config
              key: API_BASE_URL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: qa-test-config
              key: LOG_LEVEL
        - name: PYTHONUNBUFFERED
          valueFrom:
            configMapKeyRef:
              name: qa-test-config
              key: PYTHONUNBUFFERED
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        volumeMounts:
        - name: results
          mountPath: /app/allure-results
        - name: screenshots
          mountPath: /app/tests/screenshots
      
      volumes:
      - name: results
        emptyDir: {}
      - name: screenshots
        emptyDir: {}
