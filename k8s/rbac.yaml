apiVersion: v1
kind: ServiceAccount
metadata:
  name: qa-tests
  namespace: qa-automation

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qa-tests-role
  namespace: qa-automation
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qa-tests-rolebinding
  namespace: qa-automation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qa-tests-role
subjects:
- kind: ServiceAccount
  name: qa-tests
  namespace: qa-automation
